<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carlo's HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0d1f26;
    color: #e8f7fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    color: #6b8c96;
    margin-bottom: 8px;
  }
  a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    padding: 20px 24px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    border: 1px solid;
    transition: filter 0.15s;
  }
  a:hover { filter: brightness(1.15); }
  .card-btn {
    background: rgba(244,165,53,0.12);
    border-color: rgba(244,165,53,0.35);
    color: #f4a535;
  }
  .swim-btn {
    background: rgba(26,143,168,0.12);
    border-color: rgba(26,143,168,0.35);
    color: #1a8fa8;
  }
</style>
</head>
<body>
  <h1>CARLO'S HQ</h1>
  <a class="card-btn" href="card/">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Today's Card
  </a>
  <a class="swim-btn" href="swim/">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/><path d="M2 17c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/><circle cx="12" cy="6" r="2"/><path d="M12 8v3"/></svg>
    Find a Swim
  </a>
</body>
</html>
